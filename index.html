<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114"><meta name="description" content="A calm, personal workspace to organize tools, notes, projects and useful resources.">
<title>Watfa — Personal Workspace</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#17191e;--panel2:#1d2027;--line:#2b2e36;--text:#f3f4f6;--muted:#9297a3;--accent:#b8f36b;--accentText:#17200d;--blue:#9ab7ff;--radius:17px;--shadow:0 18px 55px #0003}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}aside{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column;background:#121317}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 28px}.brandmark{width:37px;height:37px;border-radius:12px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:950;font-size:20px}.brand strong{font-size:16px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.navlabel{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#6f7480;padding:13px 13px 8px;font-weight:800}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#a7abb5;text-align:left;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;transition:.15s}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:#262c21;color:var(--accent)}.ico{width:19px;text-align:center;font-size:16px}.nav .count{margin-left:auto;color:#777e8a;font-size:11px}.sidebottom{margin-top:auto}.tip{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin:15px 3px 8px}.tip b{font-size:12px}.tip p{font-size:11px;color:var(--muted);margin:6px 0 0}.profile{display:flex;align-items:center;gap:10px;padding:16px 9px 0;border-top:1px solid var(--line);margin-top:14px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#2b3548;color:#c1d1ff;font-weight:800}.profile strong{font-size:12px}.profile small{display:block;color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:75px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,55px);gap:14px}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--text);font-weight:600}.topactions{display:flex;gap:9px;align-items:center}.search{width:min(265px,32vw);position:relative}.search span{position:absolute;left:12px;top:8px;color:var(--muted)}.search input{width:100%;padding:9px 12px 9px 34px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}.search input:focus,input:focus,textarea:focus,select:focus{border-color:#718c4c}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px}.iconbtn:hover,.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:800}.btn.primary:hover{filter:brightness(1.05)}.content{max-width:1240px;margin:auto;padding:38px clamp(18px,4vw,55px) 65px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800}.headingrow{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.headingrow h1{font-size:clamp(27px,3vw,36px);letter-spacing:-1.5px;margin:5px 0 5px;line-height:1.15}.headingrow p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:26px 0 29px}.stat{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.staticon{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center}.statnum{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:11px}.statfoot{font-size:11px;color:var(--muted);margin-top:1px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}.sectionhead h2{font-size:15px;margin:0;letter-spacing:-.2px}.textbtn{border:0;background:none;color:var(--accent);font-size:12px;padding:5px}.dashboardgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.85fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.list{display:grid;gap:0}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #292c33;min-width:0}.item:last-child{border-bottom:0;padding-bottom:0}.item:first-child{padding-top:2px}.itemicon{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:17px}.itemmain{min-width:0;flex:1}.itemmain strong{font-size:13px;font-weight:650;display:block;overflow-wrap:anywhere}.itemmain p{margin:2px 0 0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.tag{font-size:10px;padding:4px 8px;border:1px solid var(--line);border-radius:100px;color:#b9bec9;white-space:nowrap}.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{border:1px solid var(--line);background:#1b1d22;border-radius:13px;text-align:left;padding:15px;color:var(--text);transition:.15s}.quick:hover{border-color:#59634a;transform:translateY(-1px)}.quick span{font-size:19px}.quick b{display:block;font-size:12px;margin-top:8px}.quick small{color:var(--muted);font-size:11px}.welcome{padding:24px 26px;border-radius:var(--radius);border:1px solid #38452d;background:linear-gradient(120deg,#20291c,#171b17 75%);display:flex;align-items:center;justify-content:space-between;gap:20px;overflow:hidden;position:relative}.welcome h2{font-size:22px;letter-spacing:-.7px;margin:4px 0 5px}.welcome p{color:#b4bcad;margin:0;max-width:460px;font-size:12px}.welcome .orb{font-size:75px;opacity:.9;transform:rotate(-10deg)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:17px;flex-wrap:wrap}.filter{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.entrycard{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:17px;min-width:0;display:flex;flex-direction:column;gap:12px;transition:.15s}.entrycard:hover{border-color:#424a3a}.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.cardicon{width:41px;height:41px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:19px}.dots{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px}.entrycard h3{font-size:15px;margin:0;overflow-wrap:anywhere}.entrycard p{color:var(--muted);font-size:12px;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.cardmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.cardfoot{padding-top:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed #373a43;border-radius:16px}.empty .emptyico{font-size:30px}.empty h3{margin:10px 0 4px}.empty p{color:var(--muted);margin:0 0 17px}.mobilebrand{display:none}.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(5px)}.modalback.open{display:flex}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#181a20;border:1px solid #353944;border-radius:19px;padding:24px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:21px;letter-spacing:-.6px}.close{border:0;background:var(--panel2);color:var(--text);border-radius:9px;width:32px;height:32px;font-size:18px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:#c5c8d0;font-weight:650}.field input,.field textarea,.field select{width:100%;background:#111216;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field textarea{min-height:100px;resize:vertical}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formactions{display:flex;justify-content:flex-end;gap:9px;padding-top:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;background:var(--accent);color:var(--accentText);padding:11px 17px;border-radius:11px;font-weight:750;z-index:20;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}.light{color-scheme:light;--bg:#f5f6f2;--panel:#fff;--panel2:#f0f1ec;--line:#e0e2d9;--text:#20231d;--muted:#777d71;--accent:#547d25;--accentText:#fff;--shadow:0 18px 55px #0001}.light aside{background:#fbfcf8}.light .nav button.active{background:#e9f0df;color:#42691c}.light .welcome{background:linear-gradient(120deg,#eaf1df,#f4f6ee);border-color:#d4dfc6}.light .welcome p{color:#606b53}.light .quick{background:#fafbf8}.light .field input,.light .field textarea,.light .field select{background:#fff}.light .item{border-color:#eceee8}.light .entrycard:hover{border-color:#b9c5a9}
@media(max-width:1000px){.app{grid-template-columns:210px minmax(0,1fr)}aside{padding:22px 11px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboardgrid{grid-template-columns:1fr}.content{padding-top:28px}}@media(max-width:680px){.app{display:block}aside{display:none}.topbar{height:64px;padding:0 16px}.crumb{display:none}.search{width:min(52vw,250px)}.topactions{margin-left:auto}.topactions .btn.primary{padding:9px 10px;font-size:12px}.content{padding:25px 16px 95px}.headingrow{align-items:flex-start}.headingrow h1{font-size:28px}.headingrow p{font-size:12px}.headingrow>.btn{display:none}.welcome{padding:20px}.welcome h2{font-size:19px}.welcome .orb{font-size:48px}.stats{gap:9px;margin:17px 0 22px}.stat{padding:13px}.statnum{font-size:25px}.stathead{font-size:11px}.statfoot{font-size:10px}.cards{grid-template-columns:1fr}.panel{padding:15px}.quickgrid{gap:8px}.quick{padding:12px}.mobile-nav{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;background:#15161bed;backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.light .mobile-nav{background:#ffffffed}.mobile-nav button{display:grid;gap:3px;justify-items:center;background:none;border:0;color:var(--muted);font-size:10px;padding:4px 9px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--accent)}.fieldrow{grid-template-columns:1fr}.modal{padding:19px}.topactions .iconbtn{padding:8px}.quickgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="brandmark">w.</div><div><strong>watfa<span style="color:var(--accent)">.</span></strong><small>PERSONAL WORKSPACE</small></div></div>
  <div class="navlabel">Workspace</div>
  <nav class="nav" id="sidenav">
    <button class="active" data-view="home"><span class="ico">⌂</span>Overview</button>
    <button data-view="tools"><span class="ico">⌘</span>My tools <span class="count" id="nav-tools">0</span></button>
    <button data-view="notes"><span class="ico">▤</span>Notes <span class="count" id="nav-notes">0</span></button>
    <button data-view="projects"><span class="ico">▦</span>Projects <span class="count" id="nav-projects">0</span></button>
    <button data-view="resources"><span class="ico">↗</span>Resources <span class="count" id="nav-resources">0</span></button>
    <button data-view="ideas"><span class="ico">✳</span>Ideas <span class="count" id="nav-ideas">0</span></button>
  </nav>
  <div class="sidebottom"><div class="tip"><b>✦ A little reminder</b><p>Capture it now. Organize it when you need to. Your workspace should work for you.</p></div><div class="profile"><div class="avatar">W</div><div><strong>My workspace</strong><small>Private on this device</small></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Workspace <span style="color:#555">/</span> <b id="crumb">Overview</b></div><div class="topactions"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search everything..." aria-label="Search workspace"></label><button class="iconbtn" id="themeBtn" title="Toggle light and dark mode" aria-label="Toggle theme">☼</button><button class="btn primary" id="topAdd">＋ <span id="addLabel">Add new</span></button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"><button class="active" data-view="home"><span>⌂</span>Home</button><button data-view="tools"><span>⌘</span>Tools</button><button data-view="notes"><span>▤</span>Notes</button><button data-view="projects"><span>▦</span>Projects</button><button data-view="resources"><span>↗</span>Saved</button></nav>
<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Add something</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="entryForm"><div id="formFields"></div><div class="formactions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save entry ↗</button></div></form></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
const TYPES={
tools:{label:'Tool',plural:'My tools',icon:'⌘',placeholder:'e.g. Visual Studio Code',desc:'Track an app, website, service or utility.',fields:[['category','Category','select',['Coding','AI','Design','Productivity','Hosting','Research','Other']],['url','Website / link','url'],['pricing','Pricing','select',['Free','Freemium','Paid','Unknown']],['description','What do you use it for?','textarea']]},
notes:{label:'Note',plural:'Notes',icon:'▤',placeholder:'e.g. Useful Git commands',desc:'Save a thought, instruction, reminder or command.',fields:[['category','Topic','text'],['description','Your note','textarea']]},
projects:{label:'Project',plural:'Projects',icon:'▦',placeholder:'e.g. Portfolio website',desc:'Keep goals, progress and next steps in one place.',fields:[['category','Status','select',['Planning','In progress','Paused','Completed']],['url','Project link','url'],['description','Overview / next steps','textarea']]},
resources:{label:'Resource',plural:'Resources',icon:'↗',placeholder:'e.g. MDN Web Docs',desc:'Save a useful website, guide or tutorial.',fields:[['url','Website / link','url'],['category','Type','select',['Documentation','Tutorial','Guide','Article','Video','Other']],['description','Why is it useful?','textarea']]},
ideas:{label:'Idea',plural:'Ideas',icon:'✳',placeholder:'e.g. Build a small automation tool',desc:'Capture something to explore or try later.',fields:[['category','Status','select',['Inbox','Researching','Trying','Archived']],['description','Details / next step','textarea']]}
};
const STORE='watfa-workspace-v1';let db=loadDB(),view='home',query='',editing=null;
function loadDB(){try{return JSON.parse(localStorage.getItem(STORE))||{tools:[],notes:[],projects:[],resources:[],ideas:[]}}catch(e){return{tools:[],notes:[],projects:[],resources:[],ideas:[]}}}
function saveDB(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){try{return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch(e){return ''}}
function allEntries(){return Object.entries(TYPES).flatMap(([type,t])=>db[type].map(item=>({...item,type,typeLabel:t.label})))}
function filtered(type){let a=type==='all'?allEntries():db[type].map(item=>({...item,type,typeLabel:TYPES[type].label}));if(query){let q=query.toLowerCase();a=a.filter(x=>[x.title,x.category,x.description,x.url].join(' ').toLowerCase().includes(q))}return a.sort((a,b)=>(b.updated||b.created||'').localeCompare(a.updated||a.created||''))}
function stat(type){return db[type].length}
function updateCounts(){Object.keys(TYPES).forEach(t=>{let el=document.getElementById('nav-'+t);if(el)el.textContent=stat(t)})}
function header(eyebrow,title,sub,button=true){return '<div class="headingrow"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+(button?'<button class="btn primary" data-add="'+(view==='home'?'tools':view)+'">＋ Add '+(view==='home'?'entry':TYPES[view].label.toLowerCase())+'</button>':'')+'</div>'}
function card(x){let t=TYPES[x.type];return '<article class="entrycard"><div class="cardtop"><div class="cardicon">'+t.icon+'</div><button class="dots" data-edit="'+x.type+':'+x.id+'" aria-label="Edit '+esc(x.title)+'" title="Edit">···</button></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||x.url||'No description added yet.')+'</p><div class="cardmeta">'+(x.category?'<span class="tag">'+esc(x.category)+'</span>':'')+(x.pricing?'<span class="tag">'+esc(x.pricing)+'</span>':'')+'</div><div class="cardfoot"><span>'+t.label+' · '+date(x.updated||x.created)+'</span>'+(x.url?'<a href="'+esc(safeUrl(x.url))+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none">Open ↗</a>':'<span></span>')+'</div></article>'}
function safeUrl(url){return /^https?:\/\//i.test(url)?url:'https://'+url}
function empty(type){return '<div class="empty"><div class="emptyico">'+(type==='all'?'✳':TYPES[type].icon)+'</div><h3>'+(query?'No matching entries':'A clean slate. For now.')+'</h3><p>'+(query?'Try another search term.':'Add your first '+(type==='all'?'entry':TYPES[type].label.toLowerCase())+' and build your workspace as you go.')+'</p>'+(!query&&type!=='all'?'<button class="btn primary" data-add="'+type+'">＋ Add '+TYPES[type].label.toLowerCase()+'</button>':'')+'</div>'}
function renderHome(){let all=allEntries().filter(x=>!query||[x.title,x.category,x.description,x.url].join(' ').toLowerCase().includes(query.toLowerCase()));let recent=all.slice(0,5);let tool=filtered('tools').slice(0,4);return header('YOUR SPACE, YOUR SYSTEM','Make room for <span style="color:var(--accent)">good ideas.</span>','A simple home for the tools you use, things you learn, and projects you build.',false)+
'<section class="welcome"><div><div class="eyebrow">YOUR PERSONAL WORKSPACE</div><h2>Everything, in its place.</h2><p>Keep track of your tools. Save the notes you will need later. Move your projects forward — one small step at a time.</p><div style="margin-top:17px"><button class="btn primary" data-add="tools">＋ Add your first tool</button></div></div><div class="orb" aria-hidden="true">✳</div></section>'+
'<section class="stats"><div class="stat"><div class="stathead">Tools <span class="staticon">⌘</span></div><div class="statnum">'+stat('tools')+'</div><div class="statfoot">Apps & utilities</div></div><div class="stat"><div class="stathead">Notes <span class="staticon">▤</span></div><div class="statnum">'+stat('notes')+'</div><div class="statfoot">Things to remember</div></div><div class="stat"><div class="stathead">Projects <span class="staticon">▦</span></div><div class="statnum">'+stat('projects')+'</div><div class="statfoot">Things you are building</div></div><div class="stat"><div class="stathead">Resources <span class="staticon">↗</span></div><div class="statnum">'+stat('resources')+'</div><div class="statfoot">Useful links saved</div></div></section>'+
'<div class="dashboardgrid"><section><div class="sectionhead"><h2>Recently added</h2><button class="textbtn" data-view="all">View everything ↗</button></div><div class="panel list">'+(recent.length?recent.map(x=>'<div class="item"><div class="itemicon">'+TYPES[x.type].icon+'</div><div class="itemmain"><strong>'+esc(x.title)+'</strong><p>'+esc(x.description||x.category||TYPES[x.type].label)+'</p></div><span class="tag">'+TYPES[x.type].label+'</span></div>').join(''):'<div style="padding:16px 0;color:var(--muted);font-size:12px">Nothing here yet. Add an entry to get started.</div>')+'</div></section>'+
'<section><div class="sectionhead"><h2>Quick capture</h2></div><div class="quickgrid"><button class="quick" data-add="tools"><span>⌘</span><b>Save a tool</b><small>App, site or service</small></button><button class="quick" data-add="notes"><span>▤</span><b>Write a note</b><small>Keep a useful thought</small></button><button class="quick" data-add="projects"><span>▦</span><b>New project</b><small>Plan the next move</small></button><button class="quick" data-add="ideas"><span>✳</span><b>Capture an idea</b><small>Think about it later</small></button></div><div style="margin-top:17px" class="sectionhead"><h2>Workspace tip</h2></div><div class="panel" style="font-size:12px;color:var(--muted)">You do not need a perfect system. Save things when they are useful, then search for them when you need them.</div></section></div>'}
function renderList(type){let t=TYPES[type],items=filtered(type);return header('YOUR WORKSPACE',t.plural,'Keep your '+t.plural.toLowerCase()+' useful, searchable, and easy to update.')+'<div class="toolbar"><select class="filter" id="sortFilter" aria-label="Sort entries"><option value="new">Recently updated</option><option value="az">Name A–Z</option><option value="old">Oldest first</option></select><span style="color:var(--muted);font-size:12px">'+items.length+' '+(items.length===1?'entry':'entries')+'</span></div><div class="cards">'+(items.length?items.map(card).join(''):empty(type))+'</div>'}
function renderAll(){let items=filtered('all');return header('YOUR WORKSPACE','Everything in one place','Search, review, and manage every saved entry.')+'<div class="toolbar"><span style="color:var(--muted);font-size:12px">'+items.length+' entries across your workspace</span></div><div class="cards">'+(items.length?items.map(card).join(''):empty('all'))+'</div>'}
function render(){document.getElementById('crumb').textContent=view==='home'?'Overview':view==='all'?'Everything':TYPES[view].plural;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('addLabel').textContent=view==='home'?'Add new':'Add '+(view==='all'?'entry':TYPES[view].label.toLowerCase());document.getElementById('content').innerHTML=view==='home'?renderHome():view==='all'?renderAll():renderList(view);updateCounts();document.title=(view==='home'?'Overview':view==='all'?'Everything':TYPES[view].plural)+' — Watfa';}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(type,id){if(!TYPES[type])type='tools';editing=id?{type,id}:null;let old=id?db[type].find(x=>x.id===id):null;let t=TYPES[type];document.getElementById('modalTitle').textContent=(old?'Edit ':'Add ')+t.label.toLowerCase();let html='<div class="field"><label for="f-title">Name *</label><input id="f-title" name="title" required maxlength="120" placeholder="'+esc(t.placeholder)+'" value="'+esc(old?.title||'')+'"></div>';for(let f of t.fields){let [key,label,kind,options]=f;html+='<div class="field"><label for="f-'+key+'">'+label+'</label>';if(kind==='select')html+='<select id="f-'+key+'" name="'+key+'">'+options.map(o=>'<option '+((old?.[key]||'')===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';else if(kind==='textarea')html+='<textarea id="f-'+key+'" name="'+key+'" placeholder="Write something useful...">'+esc(old?.[key]||'')+'</textarea>';else html+='<input id="f-'+key+'" name="'+key+'" type="'+kind+'" '+(kind==='url'?'placeholder="https://..."':'')+' value="'+esc(old?.[key]||'')+'">';html+='</div>'}html+='<div class="field"><label for="f-tags">Tags (optional)</label><input id="f-tags" name="tags" placeholder="e.g. work, useful, learning" value="'+esc(old?.tags||'')+'"></div>';if(old)html+='<button type="button" class="textbtn" id="deleteEntry" style="color:#ff8e8e;padding:8px 0">Delete this entry</button>';document.getElementById('formFields').innerHTML=html;document.getElementById('modalback').classList.add('open');setTimeout(()=>document.getElementById('f-title').focus(),50);document.getElementById('deleteEntry')?.addEventListener('click',()=>{if(confirm('Delete "'+old.title.replace(/"/g,'')+'" permanently from this browser?')){db[type]=db[type].filter(x=>x.id!==id);saveDB();closeModal();render();toast('Entry deleted')}})}
function closeModal(){document.getElementById('modalback').classList.remove('open');editing=null}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}let a=e.target.closest('[data-add]');if(a){openModal(a.dataset.add);return}let ed=e.target.closest('[data-edit]');if(ed){let [type,id]=ed.dataset.edit.split(':');openModal(type,id)}});
document.getElementById('topAdd').addEventListener('click',()=>openModal(view==='home'||view==='all'?'tools':view));
document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('cancelModal').addEventListener('click',closeModal);document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search').focus()}});
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();let form=new FormData(e.target),type=editing?.type||(view==='home'||view==='all'?'tools':view),now=new Date().toISOString();let item={title:String(form.get('title')||'').trim(),category:String(form.get('category')||''),url:String(form.get('url')||'').trim(),pricing:String(form.get('pricing')||''),description:String(form.get('description')||'').trim(),tags:String(form.get('tags')||'').trim(),updated:now};if(!item.title)return;let id=editing?.id;if(id){let idx=db[type].findIndex(x=>x.id===id);item.id=id;item.created=db[type][idx]?.created||now;db[type][idx]=item}else{item.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);item.created=now;db[type].unshift(item)}saveDB();closeModal();render();toast(id?'Changes saved':'Added to your workspace')});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render()});document.getElementById('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('watfa-theme',document.body.classList.contains('light')?'light':'dark')});if(localStorage.getItem('watfa-theme')==='light')document.body.classList.add('light');
document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='sortFilter'){let type=view;if(type==='home'||type==='all')return;db[type].sort((a,b)=>e.target.value==='az'?a.title.localeCompare(b.title):e.target.value==='old'?(a.created||'').localeCompare(b.created||''):(b.updated||b.created||'').localeCompare(a.updated||a.created||''));let el=document.querySelector('.cards');if(el){let items=filtered(type);el.innerHTML=items.length?items.map(card).join(''):empty(type)}}});
render();
</script>
</body>
</html>
